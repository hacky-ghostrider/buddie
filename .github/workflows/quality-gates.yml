name: Quality Gate Validation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality-gates:
    name: Continuous evaluation quality gates
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
      ENABLE_LANGSMITH: "false"
      ENABLE_DEEPEVAL: "false"
      QUALITY_GATE_ENABLED: "true"
      REPORT_DIRECTORY: ./data/reports
      BENCHMARK_DIRECTORY: ./data/benchmarks
      QUALITY_REPORT_DIRECTORY: ./data/quality_reports
      BENCHMARK_HISTORY_PATH: ./data/benchmarks/history.json
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create output directories
        run: mkdir -p data/reports data/benchmarks data/quality_reports

      - name: Validate quality gates (fail CI on FAIL / regression)
        run: python scripts/validate_quality_gates.py

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: data/quality_reports/
          if-no-files-found: ignore
