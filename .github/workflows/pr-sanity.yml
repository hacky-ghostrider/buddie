name: PR Sanity

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  sanity:
    name: Sanity tier (core Buddie + 12 goldens)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      ENABLE_LANGSMITH: "false"
      ENABLE_DEEPEVAL: "false"
      QUALITY_GATE_ENABLED: "true"
      OPENAI_API_KEY: ""
      LANGSMITH_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke + sanity-tier pytest
        run: pytest -m "smoke or sanity" -q --tb=short
