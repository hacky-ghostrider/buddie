name: Benchmark Runner

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  benchmark:
    name: Benchmark aggregation
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
      ENABLE_LANGSMITH: "false"
      ENABLE_DEEPEVAL: "false"
      REPORT_DIRECTORY: ./data/reports
      BENCHMARK_DIRECTORY: ./data/benchmarks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create output directories
        run: mkdir -p data/reports data/benchmarks

      - name: Produce evaluation reports
        run: python scripts/run_evaluation.py --batch --dry-run --run-name ci_evaluation

      - name: Run benchmark
        run: |
          python scripts/run_benchmark.py \
            --reports data/reports/ci_evaluation.json \
            --run-name ci_benchmark

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: data/benchmarks/ci_benchmark.*
          if-no-files-found: error
